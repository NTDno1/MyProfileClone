services:
  bio-link:
    build: .
    image: bio-link:latest
    container_name: bio-link
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3005
    deploy:
      resources:
        limits:
          memory: 128M
