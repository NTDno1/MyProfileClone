<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fcf7f4" />
  <title id="aff-page-title">Góc Đồ Xinh &amp; Tủ Đồ Tiểu Thư — NA 2HAND Boutique</title>
  <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-girlfriend-2.png?v=2" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=2" />
  <meta property="og:image" content="https://na2hand.com/images/brand-logo.jpg" />
  <meta name="description" content="Tủ đồ tiểu thư & tổng hợp link sản phẩm chính hãng tuyển chọn bởi NA 2HAND. Tìm nhanh theo mã số hoặc tên thiết kế!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600;1,700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/affiliate.css?v=3" />
</head>
<body data-tone="blush">
  <!-- Bespoke Coquette Vector Symbols (Synchronized with /shop) -->
  <svg width="0" height="0" style="position:absolute; visibility:hidden;" aria-hidden="true">
    <defs>
      <symbol id="ico-star4" viewBox="0 0 24 24">
        <path
          d="M12 1.5C12.7 7.4 16.6 11.3 22.5 12C16.6 12.7 12.7 16.6 12 22.5C11.3 16.6 7.4 12.7 1.5 12C7.4 11.3 11.3 7.4 12 1.5Z"
          fill="currentColor"
        />
      </symbol>
      <symbol id="ico-bow" viewBox="0 0 28 24">
        <path
          d="M14 11.5C10.5 6.2 4.2 4.5 2.4 7.8C0.8 10.8 4.6 14.8 11.8 13.2M14 11.5C17.5 6.2 23.8 4.5 25.6 7.8C27.2 10.8 23.4 14.8 16.2 13.2M14 11.5C12.2 15.2 9.4 19.2 6.8 21.5M14 11.5C15.8 15.2 18.6 19.2 21.2 21.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
        <circle cx="14" cy="12" r="2.3" fill="currentColor" />
      </symbol>
      <symbol id="ico-heart" viewBox="0 0 24 24">
        <path
          d="M12 20.6C12 20.6 3.5 15.1 3.5 8.9C3.5 6.1 5.7 4 8.4 4C10.1 4 11.4 4.9 12 6.1C12.6 4.9 13.9 4 15.6 4C18.3 4 20.5 6.1 20.5 8.9C20.5 15.1 12 20.6 12 20.6Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          fill="currentColor"
        />
      </symbol>
    </defs>
  </svg>

  <!-- Twinkling Ambient Celestial Sparkles (Synchronized with /shop) -->
  <div class="aff-ambient-sparkles" id="aff-sparkles" aria-hidden="true"></div>

  <!-- TOP STICKY ATELIER HEADER -->
  <header class="aff-topbar">
    <div class="aff-topbar-inner">
      <a href="/" class="aff-handle-wrap" title="Quay về Trang Bio chính">
        <span class="aff-brand-dot">
          <img src="/images/brand-logo.jpg?v=2" alt="NA 2HAND Logo" class="aff-brand-logo-img" />
        </span>
        <span class="aff-handle-meta">
          <span class="aff-handle-text" id="aff-handle">na2hand</span>
          <span class="aff-handle-kicker">Atelier Lookbook</span>
        </span>
      </a>

      <div class="aff-top-actions">
        <a href="/shop" class="aff-shop-chip">
          <svg width="14" height="12"><use href="#ico-bow"></use></svg>
          <span>Tiệm 2Hand</span>
        </a>
        <button type="button" class="aff-share-btn" id="btn-share-aff" aria-label="Chia sẻ Góc Đồ Xinh" title="Sao chép & chia sẻ đường dẫn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN COQUETTE SHOWCASE SHELL -->
  <main class="aff-shell">
    <!-- 1. CREATOR ATELIER PROFILE CARD -->
    <section class="aff-card aff-profile-card">
      <div class="aff-profile-lace" aria-hidden="true"></div>

      <div class="aff-kicker-pill">
        <svg width="11" height="11"><use href="#ico-star4"></use></svg>
        <span>GÓC ĐỒ XINH &amp; LINK CHÍNH HÃNG</span>
        <svg width="11" height="11"><use href="#ico-star4"></use></svg>
      </div>

      <div class="aff-avatar-stage">
        <div class="aff-avatar-ring">
          <img id="aff-avatar" src="/media/bio-link/girlfriend-1.jpg" alt="Avatar" />
        </div>
        <span class="aff-avatar-bow" aria-hidden="true">
          <svg width="20" height="17"><use href="#ico-bow"></use></svg>
        </span>
      </div>

      <h1 class="aff-creator-title" id="aff-title">NA 2HAND Closet</h1>
      <p class="aff-creator-sub" id="aff-subtitle">Tủ đồ xinh &amp; link chính hãng tuyển chọn — nàng gõ mã số ở dưới là thấy ngay nhé ♡</p>
    </section>

    <!-- 2. SEARCH + CATEGORY PILLS + PRODUCT CATALOG CARD -->
    <section class="aff-card aff-catalog-card">
      <!-- Instant Rose Search Capsule -->
      <div class="aff-search-wrap">
        <svg class="aff-search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="aff-search-input"
          class="aff-search-input"
          placeholder="Nhập mã số (VD: 01, 06) hoặc tên váy, áo nàng đang tìm..."
          autocomplete="off"
        />
        <button type="button" id="aff-search-clear" class="aff-search-clear" style="display: none;" aria-label="Xóa tìm kiếm">✕</button>
      </div>

      <!-- Category Pills Bar with Live Counts + Expand Toggle -->
      <div class="aff-cats-bar-wrap">
        <div class="aff-cats-list" id="aff-cats-list"></div>
        <button type="button" class="aff-cats-expand" id="btn-expand-cats" aria-label="Mở rộng toàn bộ danh mục" title="Xem tất cả danh mục">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Affiliate Product Sections -->
      <div id="aff-sections-root" class="aff-sections-root">
        <div class="aff-loading">Đang mở tủ đồ xinh cho nàng...</div>
      </div>
    </section>

    <!-- PERMANENT LOCKED SIGNATURE -->
    <footer class="aff-footer">
      <div class="aff-footer-bow">
        <img src="/images/brand-logo.jpg?v=2" alt="NA 2HAND Logo" class="aff-footer-logo" />
      </div>
      <p class="aff-signature">Made with ♡ by My Love</p>
    </footer>
  </main>

  <div class="aff-toast" id="aff-toast">Đã sao chép đường dẫn chia sẻ!</div>

  <script src="/js/affiliate.js?v=3"></script>
</body>
</html>
