<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title id="aff-page-title">Tủ Đồ Affiliate &amp; Link Đồ Xinh ✨ NA 2HAND</title>
  <meta name="description" content="Tổng hợp toàn bộ link đồ xinh, quần áo, váy đầm & phụ kiện chuẩn chính hãng. Tìm nhanh theo mã số hoặc tên sản phẩm!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/affiliate.css?v=1" />
</head>
<body data-tone="oatmeal">
  <!-- TOP STICKY CREATOR HEADER (Passio Style) -->
  <header class="aff-topbar">
    <div class="aff-topbar-inner">
      <a href="/" class="aff-handle-wrap" title="Quay về Trang Bio chính">
        <span class="aff-brand-dot" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </span>
        <span class="aff-handle-text" id="aff-handle">na2hand</span>
      </a>

      <div class="aff-top-actions">
        <a href="/shop" class="aff-shop-chip">Tiệm 2Hand</a>
        <button type="button" class="aff-share-btn" id="btn-share-aff" aria-label="Chia sẻ trang Affiliate" title="Chia sẻ đường dẫn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14l5-5-5-5"/>
            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v.5"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN PASSIO-STYLE SHOWCASE COLUMN -->
  <main class="aff-shell">
    <!-- 1. CREATOR PROFILE CARD -->
    <section class="aff-card aff-profile-card">
      <div class="aff-avatar-ring">
        <img id="aff-avatar" src="/media/bio-link/girlfriend-1.jpg" alt="Avatar" />
      </div>
      <h1 class="aff-creator-title" id="aff-title">NA 2HAND Closet</h1>
      <p class="aff-creator-sub" id="aff-subtitle">Search khung tìm kiếm phía dưới là siêu nhanh 👇</p>
    </section>

    <!-- 2. SEARCH + CATEGORY PILLS + PRODUCT CATALOG CARD -->
    <section class="aff-card aff-catalog-card">
      <!-- Instant Search Box -->
      <div class="aff-search-wrap">
        <svg class="aff-search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="aff-search-input"
          class="aff-search-input"
          placeholder="Tìm kiếm theo mã số (VD: 01, 179) hoặc tên sản phẩm..."
          autocomplete="off"
        />
        <button type="button" id="aff-search-clear" class="aff-search-clear" style="display: none;" aria-label="Xóa tìm kiếm">✕</button>
      </div>

      <!-- Category Pills Bar with Live Counts + Expand Toggle -->
      <div class="aff-cats-bar-wrap">
        <div class="aff-cats-list" id="aff-cats-list"></div>
        <button type="button" class="aff-cats-expand" id="btn-expand-cats" aria-label="Mở rộng toàn bộ danh mục" title="Xem tất cả danh mục">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Affiliate Product Sections -->
      <div id="aff-sections-root" class="aff-sections-root">
        <div class="aff-loading">Đang tải danh sách sản phẩm...</div>
      </div>
    </section>

    <!-- PERMANENT LOCKED SIGNATURE -->
    <footer class="aff-footer">
      <p class="aff-signature">Made with ♡ by My Love</p>
    </footer>
  </main>

  <div class="aff-toast" id="aff-toast">Đã sao chép đường dẫn chia sẻ!</div>

  <script src="/js/affiliate.js?v=1"></script>
</body>
</html>
