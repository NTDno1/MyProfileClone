<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" fill="none">
  <rect width="320" height="340" rx="16" fill="#ffffff"/>
  <!-- Waist measurement arrow -->
  <line x1="102" y1="26" x2="218" y2="26" stroke="#c83767" stroke-width="1.4"/>
  <polygon points="102,26 107,23 107,29" fill="#c83767"/>
  <polygon points="218,26 213,23 213,29" fill="#c83767"/>
  <text x="160" y="19" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2b151e">Vòng bụng</text>

  <!-- Pants silhouette (Loose / Flared Jeans) -->
  <path d="M104 40 Q160 44 216 40 L224 98 L234 308 Q208 312 188 308 L164 134 L156 134 L132 308 Q112 312 86 308 L96 98 Z" stroke="#2b151e" stroke-width="1.8" fill="#fcf9fa" stroke-linejoin="round"/>
  <!-- Waistband -->
  <path d="M103 54 Q160 58 217 54" stroke="#2b151e" stroke-width="1.4"/>
  <!-- Button & Fly -->
  <circle cx="160" cy="47" r="2.6" stroke="#2b151e" stroke-width="1.3"/>
  <path d="M160 56 L160 118 Q168 118 169 108 L169 56" stroke="#2b151e" stroke-width="1.2"/>
  <!-- Belt loops -->
  <line x1="122" y1="41" x2="122" y2="55" stroke="#2b151e" stroke-width="1.5"/>
  <line x1="198" y1="41" x2="198" y2="55" stroke="#2b151e" stroke-width="1.5"/>
  <!-- Pockets -->
  <path d="M103 56 Q116 80 132 76" stroke="#2b151e" stroke-width="1.3"/>
  <path d="M217 56 Q204 80 188 76" stroke="#2b151e" stroke-width="1.3"/>

  <!-- Hip measurement arrow -->
  <line x1="95" y1="98" x2="225" y2="98" stroke="#c83767" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="192" y="110" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#c83767">Vòng mông</text>

  <!-- Thigh measurement arrow -->
  <line x1="163" y1="146" x2="227" y2="146" stroke="#c83767" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="195" y="158" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#c83767">Vòng đùi</text>

  <!-- Length measurement arrow -->
  <line x1="68" y1="40" x2="68" y2="308" stroke="#c83767" stroke-width="1.4"/>
  <polygon points="68,40 65,45 71,45" fill="#c83767"/>
  <polygon points="68,308 65,303 71,303" fill="#c83767"/>
  <text x="58" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2b151e" transform="rotate(-90 58 176)">Dài quần</text>
</svg>
